# Coolify: Base Directory / ; Docker Compose Location /docker-compose.yml
# Only "api" is routed publicly via Coolify HTTPS; PostgreSQL is private.
# Credentials are runtime-only. docker compose build must not require them,
# because Coolify interpolates this file with build-time.env before containers start.
# No fallback credentials: empty values deliberately fail at service startup.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simplenotes}
      POSTGRES_USER: ${POSTGRES_USER:-simplenotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-simplenotes}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-simplenotes}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      GOOGLE_DESKTOP_CLIENT_ID: ${GOOGLE_DESKTOP_CLIENT_ID:-}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${GOOGLE_DESKTOP_CLIENT_SECRET:-}
      APP_JWT_SECRET_BASE64: ${APP_JWT_SECRET_BASE64:-}
      # Separate consent; unset by default. Tokens require a durable AES-GCM key.
      APP_CALENDAR_PUBLIC_ORIGIN: ${APP_CALENDAR_PUBLIC_ORIGIN:-}
      APP_CALENDAR_TOKEN_KEY_BASE64: ${APP_CALENDAR_TOKEN_KEY_BASE64:-}
      APP_CALENDAR_GOOGLE_CLIENT_ID: ${APP_CALENDAR_GOOGLE_CLIENT_ID:-}
      APP_CALENDAR_GOOGLE_CLIENT_SECRET: ${APP_CALENDAR_GOOGLE_CLIENT_SECRET:-}
      APP_CALENDAR_MICROSOFT_CLIENT_ID: ${APP_CALENDAR_MICROSOFT_CLIENT_ID:-}
      APP_CALENDAR_MICROSOFT_CLIENT_SECRET: ${APP_CALENDAR_MICROSOFT_CLIENT_SECRET:-}
      # Attachments remain disabled unless operator configures a private S3 bucket.
      APP_ATTACHMENTS_ENABLED: ${APP_ATTACHMENTS_ENABLED:-false}
      APP_ATTACHMENTS_BUCKET: ${APP_ATTACHMENTS_BUCKET:-}
      APP_ATTACHMENTS_REGION: ${APP_ATTACHMENTS_REGION:-eu-central-1}
      APP_ATTACHMENTS_ENDPOINT: ${APP_ATTACHMENTS_ENDPOINT:-}
      # Private clamd INSTREAM; required before enabling S3.
      APP_ATTACHMENTS_SCANNER_HOST: ${APP_ATTACHMENTS_SCANNER_HOST:-}
      APP_ATTACHMENTS_SCANNER_PORT: ${APP_ATTACHMENTS_SCANNER_PORT:-3310}
      # AWS SDK default credentials; keep secrets in the Coolify secret store.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

volumes:
  postgres_data:
