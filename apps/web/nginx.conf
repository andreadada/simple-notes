server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; frame-src https://accounts.google.com; connect-src 'self' https:; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;
    location /api/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://api:8080;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 60s;
    }
    location = /healthz { access_log off; return 200 "ok\n"; }
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
