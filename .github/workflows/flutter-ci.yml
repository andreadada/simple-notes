name: Flutter CI
on:
  push:
    paths:
      - 'apps/flutter/**'
      - 'tools/t4-build-devices.ps1'
      - 'tools/t4-device-build.example.json'
      - 'tools/t4-reset-local-data.ps1'
      - 'infra/reset-test-workspace.sh'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - 'tools/t4-reset-local-data.ps1'
      - 'infra/reset-test-workspace.sh'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate production reset script syntax only
        run: bash -n infra/reset-test-workspace.sh
      - name: Generate Android and Windows scaffold
        working-directory: apps/flutter
        run: flutter create --platforms=android,windows --project-name simple_notes .
      - name: Verify tracked Android identity
        working-directory: apps/flutter
        run: |
          grep -F 'applicationId = "it.andreadada.simplenotes"' android/app/build.gradle.kts
          grep -F 'namespace = "it.andreadada.simplenotes"' android/app/build.gradle.kts
          test -f android/app/src/main/java/it/andreadada/simplenotes/MainActivity.java
      - name: Fetch dependencies
        working-directory: apps/flutter
        run: flutter pub get
      - name: Generate Drift database
        working-directory: apps/flutter
        run: dart run build_runner build
      - name: Static analysis
        working-directory: apps/flutter
        run: flutter analyze
      - name: Install nativeapi Linux build headers for Flutter widget tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libx11-dev libxi-dev
      - name: Widget tests
        working-directory: apps/flutter
        run: flutter test
  android-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        working-directory: apps/flutter
        run: flutter create --platforms=android --project-name simple_notes .
      - name: Generate Drift database
        working-directory: apps/flutter
        run: dart run build_runner build
      - name: Verify tracked Android identity
        working-directory: apps/flutter
        run: |
          grep -F 'applicationId = "it.andreadada.simplenotes"' android/app/build.gradle.kts
          grep -F 'namespace = "it.andreadada.simplenotes"' android/app/build.gradle.kts
          test -f android/app/src/main/java/it/andreadada/simplenotes/MainActivity.java
          grep -F 'enableKotlin = false' android/app/build.gradle.kts
      - name: Build debug APK
        working-directory: apps/flutter
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: matrix.java == '17'
        with:
          name: simple-notes-android-debug
          path: apps/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Validate T4.2 build tool (no personal credentials)
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 't4-acceptance-test.json'
          @{ GOOGLE_DESKTOP_CLIENT_ID = '12345-fake.apps.googleusercontent.com'
             GOOGLE_WEB_CLIENT_ID = '12345-fake.apps.googleusercontent.com' } |
            ConvertTo-Json | Set-Content -LiteralPath $config
          ./tools/t4-build-devices.ps1 -Target both -ConfigPath $config -ValidateOnly
          ./tools/t4-build-devices.ps1 -Target both -ConfigPath $config -CheckOnly
      - name: Parse local reset tool (without executing it)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/tools/t4-reset-local-data.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Generate Windows scaffold
        working-directory: apps/flutter
        run: flutter create --platforms=windows --project-name simple_notes .
      - name: Generate Drift database
        working-directory: apps/flutter
        run: dart run build_runner build
      - name: Build Windows executable
        working-directory: apps/flutter
        run: flutter build windows --release
      - name: Build development MSIX (do not install or trust signing cert)
        working-directory: apps/flutter
        shell: pwsh
        run: dart run msix:create --build-windows false
      - uses: actions/upload-artifact@v4
        with:
          name: simple-notes-windows-msix-test
          path: apps/flutter/build/windows/**/*.msix
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: simple-notes-windows-release
          path: apps/flutter/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 7
