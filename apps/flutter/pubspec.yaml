name: simple_notes
description: Offline-first tasks and notes for Windows and Android.
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  forui: ^0.27.6
  shared_preferences: ^2.3.3
  connectivity_plus: ^7.3.2
  uuid: ^4.5.1
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  drift: ^2.28.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.0
  sqlite3_flutter_libs: ^0.5.31
  path: ^1.9.0
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.4.15
  sqlite3: ^2.7.5 # V4 -> V5 migration fixtures using the native SQLite engine
flutter:
  uses-material-design: true
