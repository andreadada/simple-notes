name: Compose validation
on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - infra/backup-postgres.sh
      - infra/verify-restore.sh
      - infra/t4-preflight.sh
      - infra/t4-check-api.sh
      - infra/t4-inspect-db.sh
      - infra/validate-release-capabilities.py
      - infra/test_release_capabilities.py
      - infra/release-readiness.sh
      - .github/workflows/compose-ci.yml
  pull_request:
    paths:
      - docker-compose.yml
      - .github/workflows/compose-ci.yml
      - infra/backup-postgres.sh
      - infra/verify-restore.sh
      - infra/t4-preflight.sh
      - infra/t4-check-api.sh
      - infra/t4-inspect-db.sh
      - infra/validate-release-capabilities.py
      - infra/test_release_capabilities.py
      - infra/release-readiness.sh
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup script syntax (no Docker operations)
        run: bash -n infra/backup-postgres.sh infra/verify-restore.sh infra/t4-preflight.sh infra/t4-check-api.sh infra/t4-inspect-db.sh infra/release-readiness.sh
      - name: Unit-test strict release capability contract offline
        run: python3 -m unittest discover -s infra -p 'test_release_capabilities.py' -v
      - name: Validate build Compose without runtime secrets
        run: |
          # Coolify uses a build-time.env with no runtime-only credentials.
          env -u POSTGRES_PASSWORD -u GOOGLE_CLIENT_IDS -u APP_JWT_SECRET_BASE64 \
            docker compose -f docker-compose.yml config --quiet
      - name: Validate runtime secrets are mapped to both containers
        env:
          POSTGRES_PASSWORD: ci-placeholder-only
          GOOGLE_CLIENT_IDS: ci-placeholder.apps.googleusercontent.com
          APP_JWT_SECRET_BASE64: ci-placeholder-base64
        run: |
          docker compose -f docker-compose.yml config --format json | python3 -c '
          import json,sys
          cfg=json.load(sys.stdin)["services"]
          assert cfg["db"]["environment"]["POSTGRES_PASSWORD"] == "ci-placeholder-only"
          assert cfg["api"]["environment"]["SPRING_DATASOURCE_PASSWORD"] == "ci-placeholder-only"
          assert cfg["api"]["environment"]["APP_JWT_SECRET_BASE64"] == "ci-placeholder-base64"
          assert cfg["api"]["environment"]["GOOGLE_CLIENT_IDS"] == "ci-placeholder.apps.googleusercontent.com"
          print("Runtime credential mapping validated (values not displayed)")
          '

  backup-restore-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Isolated synthetic backup and restore
        shell: bash
        run: |
          set -euo pipefail
          db_name="simple-notes-backup-smoke-$GITHUB_RUN_ID"
          folder="$(mktemp -d)"
          trap 'docker rm -f "$db_name" >/dev/null 2>&1 || true; rm -rf "$folder"' EXIT
          docker run --rm -d --name "$db_name" \
            -e POSTGRES_USER=ciuser -e POSTGRES_DB=synthetic \
            -e POSTGRES_PASSWORD=ci-not-real postgres:17-alpine >/dev/null
          for i in $(seq 1 40); do
            if docker logs "$db_name" 2>&1 | grep -q 'PostgreSQL init process complete' && \
                docker exec "$db_name" pg_isready -U ciuser -d synthetic >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$db_name" psql -U ciuser -d synthetic \
            -v ON_ERROR_STOP=1 -c '
              CREATE TABLE app_user(id UUID PRIMARY KEY);
              CREATE TABLE task(id UUID PRIMARY KEY);
              CREATE TABLE note(id UUID PRIMARY KEY);
              CREATE TABLE sync_change(id BIGINT PRIMARY KEY);
              CREATE TABLE sync_operation(id UUID PRIMARY KEY);
              CREATE TABLE flyway_schema_history (
                installed_rank INTEGER PRIMARY KEY, version VARCHAR(50), success BOOLEAN
              );
              INSERT INTO flyway_schema_history VALUES (6, '"'"'6'"'"', TRUE);
              INSERT INTO app_user VALUES ('"'"'00000000-0000-0000-0000-000000000001'"'"');
            '
          # Read-only inventory must accept this specific synthetic database.
          DB_CONTAINER="$db_name" EXPECTED_POSTGRES_DB=synthetic \
            bash infra/t4-inspect-db.sh
          # A V6 database MUST fail a strict V10 client release gate.
          if DB_CONTAINER="$db_name" EXPECTED_POSTGRES_DB=synthetic \
              REQUIRE_FLYWAY_VERSION=10 bash infra/t4-inspect-db.sh; then
            echo "ERROR: V6 database was incorrectly accepted as V10" >&2
            exit 1
          fi
          # Synthetic-only additive rehearsal of columns and Flyway entries.
          # No production DB, Docker volume, or live API is connected.
          docker exec "$db_name" psql -U ciuser -d synthetic \
            -v ON_ERROR_STOP=1 -c '
              ALTER TABLE task ADD COLUMN due_kind TEXT,
                ADD COLUMN due_date DATE,
                ADD COLUMN due_time TIME,
                ADD COLUMN due_timezone TEXT,
                ADD COLUMN due_offset_seconds INTEGER,
                ADD COLUMN block_start_at TIMESTAMPTZ,
                ADD COLUMN block_end_at TIMESTAMPTZ,
                ADD COLUMN block_timezone TEXT,
                ADD COLUMN blocks_json TEXT NOT NULL DEFAULT '"'"'[]'"'"',
                ADD COLUMN recurrence_json TEXT NOT NULL DEFAULT '"'"'{"kind":"none"}'"'"';
              INSERT INTO flyway_schema_history (installed_rank,version,success)
                VALUES (7,'"'"'7'"'"',true),(8,'"'"'8'"'"',true),
                       (9,'"'"'9'"'"',true),(10,'"'"'10'"'"',true);
            '
          DB_CONTAINER="$db_name" EXPECTED_POSTGRES_DB=synthetic \
            REQUIRE_FLYWAY_VERSION=10 bash infra/t4-inspect-db.sh
          # Flyway V10 history alone is not proof if the column is absent.
          docker exec "$db_name" psql -U ciuser -d synthetic \
            -v ON_ERROR_STOP=1 -c 'ALTER TABLE task DROP COLUMN recurrence_json;'
          if DB_CONTAINER="$db_name" EXPECTED_POSTGRES_DB=synthetic \
              REQUIRE_FLYWAY_VERSION=10 bash infra/t4-inspect-db.sh; then
            echo "ERROR: incomplete V10 schema was incorrectly accepted" >&2
            exit 1
          fi
          docker exec "$db_name" psql -U ciuser -d synthetic \
            -v ON_ERROR_STOP=1 -c \
              'ALTER TABLE task ADD COLUMN recurrence_json TEXT NOT NULL DEFAULT '"'"'{"kind":"none"}'"'"';'
          DB_CONTAINER="$db_name" EXPECTED_POSTGRES_DB=synthetic \
            REQUIRE_FLYWAY_VERSION=10 bash infra/t4-inspect-db.sh
          if DB_CONTAINER="$db_name" EXPECTED_POSTGRES_DB=wrong_database \
              bash infra/t4-inspect-db.sh; then
            echo "ERROR: wrong DB identity was accepted" >&2
            exit 1
          fi
          # The fixture's DB name is deliberately 'synthetic', not production.
          EXPECTED_POSTGRES_DB=synthetic DB_CONTAINER="$db_name"             BACKUP_DIR="$folder" bash infra/backup-postgres.sh
          archive="$(find "$folder" -maxdepth 1 -name '*.dump' -print -quit)"
          test -n "$archive"
          bash infra/verify-restore.sh "$archive"
          test -s "$archive.restore-ok"
          # Synthetic fixture ONLY: checking offsite-attestation gate behavior.
          # This never attests anything about the real Coolify database.
          if T4_ARCHIVE="$archive" T4_APPROVED_COMMIT="$(git rev-parse HEAD)"               bash infra/t4-preflight.sh; then
            echo "ERROR: missing offsite confirmation accepted" >&2
            exit 1
          fi
          T4_ARCHIVE="$archive" T4_OFFSITE_CONFIRMED=yes             T4_APPROVED_COMMIT="$(git rev-parse HEAD)" bash infra/t4-preflight.sh
          # A proof from a long-ago restore must not authorize a deployment.
          cp "$archive.restore-ok" "$folder/valid-restore-receipt"
          sed -i 's/^VERIFIED_UTC=.*/VERIFIED_UTC=2000-01-01T00:00:00Z/' "$archive.restore-ok"
          if T4_ARCHIVE="$archive" T4_OFFSITE_CONFIRMED=yes \
              T4_APPROVED_COMMIT="$(git rev-parse HEAD)" bash infra/t4-preflight.sh; then
            echo "ERROR: stale restore receipt accepted" >&2
            exit 1
          fi
          mv "$folder/valid-restore-receipt" "$archive.restore-ok"
          printf 'tampered' >> "$archive"
          if bash infra/verify-restore.sh "$archive"; then
            echo "ERROR: tampered restore accepted" >&2
            exit 1
          fi
          if T4_ARCHIVE="$archive" T4_OFFSITE_CONFIRMED=yes               T4_APPROVED_COMMIT="$(git rev-parse HEAD)" bash infra/t4-preflight.sh; then
            echo "ERROR: tampered preflight accepted" >&2
            exit 1
          fi
