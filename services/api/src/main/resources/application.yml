spring:
  application:
    name: simple-notes-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/simplenotes}
    username: ${SPRING_DATASOURCE_USERNAME:simplenotes}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  port: 8080
app:
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
    desktop-client-id: ${GOOGLE_DESKTOP_CLIENT_ID:}
    desktop-client-secret: ${GOOGLE_DESKTOP_CLIENT_SECRET:}
  jwt:
    issuer: simple-notes-api
    secret-base64: ${APP_JWT_SECRET_BASE64:}
