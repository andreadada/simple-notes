# Tracked Gradle properties for Android Windows development.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Workaround: Kotlin incremental cache fails with "different roots" when
# PUB_CACHE is on C: but the Flutter project is on E: (Windows).
kotlin.incremental=false

# Flutter's AGP 9 migration may use the old DSL until plugins are ready.
# See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.newDsl=false
