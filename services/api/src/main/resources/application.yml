spring:
  application:
    name: simple-notes-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/simplenotes}
    username: ${SPRING_DATASOURCE_USERNAME:simplenotes}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  port: 8080
app:
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
    desktop-client-id: ${GOOGLE_DESKTOP_CLIENT_ID:}
    desktop-client-secret: ${GOOGLE_DESKTOP_CLIENT_SECRET:}
  jwt:
    issuer: simple-notes-api
    secret-base64: ${APP_JWT_SECRET_BASE64:}

  attachments:
    enabled: ${APP_ATTACHMENTS_ENABLED:false}
    bucket: ${APP_ATTACHMENTS_BUCKET:}
    region: ${APP_ATTACHMENTS_REGION:eu-central-1}
    endpoint: ${APP_ATTACHMENTS_ENDPOINT:}

  calendar:
    public-origin: ${APP_CALENDAR_PUBLIC_ORIGIN:}
    token-key-base64: ${APP_CALENDAR_TOKEN_KEY_BASE64:}
    google-client-id: ${APP_CALENDAR_GOOGLE_CLIENT_ID:}
    google-client-secret: ${APP_CALENDAR_GOOGLE_CLIENT_SECRET:}
    microsoft-client-id: ${APP_CALENDAR_MICROSOFT_CLIENT_ID:}
    microsoft-client-secret: ${APP_CALENDAR_MICROSOFT_CLIENT_SECRET:}
